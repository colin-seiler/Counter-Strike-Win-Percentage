  #     DB_PORT: 5432
  #     DB_NAME: ${DB_NAME}
  #     DB_USER: ${DB_USER}
  #     DB_PASSWORD: ${DB_PASSWORD}
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - cs2-network
  #   restart: unless-stopped

  # #UI
  # ui:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: cs2-ui
  #   environment:
  #     API_URL: http://api:8000
  #   ports:
  #     - "8501:8501"
  #   depends_on:
  #     - api
  #   networks:
  #     - cs2-network
  #   restart: unless-stopped 

  #Backend Work
  processor:
    build:
      context: .
      dockerfile: Dockerfile.src
    container_name: cs2-processor
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cs2-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  cs2-network:
    driver: bridge